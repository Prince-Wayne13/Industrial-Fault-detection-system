<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="1160" viewBox="0 0 1250 1160"><title>Use-case diagram</title><rect width="1250" height="1160" fill="#fff"/><rect x="250" y="30" width="750" height="960" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="625" y="76" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="28" text-anchor="middle" font-weight="bold" font-style="normal" fill="#000">Industrial Fault Detection System</text><ellipse cx="625" cy="165" rx="320" ry="54" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="625" y="158" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">UC-2: Detect a Fault and</text><text x="625" y="190" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">Alert the User</text><ellipse cx="625" cy="315" rx="320" ry="54" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="625" y="308" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">UC-3: Review Fault History</text><text x="625" y="340" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">and Generate a Report</text><ellipse cx="625" cy="465" rx="320" ry="54" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="625" y="458" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">UC-1: Monitor</text><text x="625" y="490" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">Equipment Status</text><ellipse cx="625" cy="615" rx="320" ry="54" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="625" y="608" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">UC-5: Administer Users</text><text x="625" y="640" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">and Equipment</text><ellipse cx="625" cy="765" rx="320" ry="54" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="625" y="758" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">UC-4: Continue Monitoring During</text><text x="625" y="790" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">a Connection Interruption</text><ellipse cx="625" cy="915" rx="320" ry="54" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="625" y="908" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">UC-6: Place Equipment in</text><text x="625" y="940" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="25" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">Maintenance Mode</text><circle cx="110" cy="275" r="18" fill="#fff" stroke="#000" stroke-width="2.5"/><line x1="110" y1="293" x2="110" y2="350" stroke="#000" stroke-width="2.5"/><line x1="78" y1="315" x2="142" y2="315" stroke="#000" stroke-width="2.5"/><line x1="110" y1="350" x2="82" y2="390" stroke="#000" stroke-width="2.5"/><line x1="110" y1="350" x2="138" y2="390" stroke="#000" stroke-width="2.5"/><text x="110" y="427" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="24" text-anchor="middle" font-weight="bold" font-style="normal" fill="#000">Operator</text><circle cx="110" cy="875" r="18" fill="#fff" stroke="#000" stroke-width="2.5"/><line x1="110" y1="893" x2="110" y2="950" stroke="#000" stroke-width="2.5"/><line x1="78" y1="915" x2="142" y2="915" stroke="#000" stroke-width="2.5"/><line x1="110" y1="950" x2="82" y2="990" stroke="#000" stroke-width="2.5"/><line x1="110" y1="950" x2="138" y2="990" stroke="#000" stroke-width="2.5"/><text x="110" y="1027" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="24" text-anchor="middle" font-weight="bold" font-style="normal" fill="#000">Engineer</text><circle cx="1135" cy="500" r="18" fill="#fff" stroke="#000" stroke-width="2.5"/><line x1="1135" y1="518" x2="1135" y2="575" stroke="#000" stroke-width="2.5"/><line x1="1103" y1="540" x2="1167" y2="540" stroke="#000" stroke-width="2.5"/><line x1="1135" y1="575" x2="1107" y2="615" stroke="#000" stroke-width="2.5"/><line x1="1135" y1="575" x2="1163" y2="615" stroke="#000" stroke-width="2.5"/><text x="1135" y="652" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="24" text-anchor="middle" font-weight="bold" font-style="normal" fill="#000">Administrator</text><line x1="142" y1="315" x2="472.2" y2="212.4" stroke="#000" stroke-width="2.2"/><line x1="142" y1="315" x2="305.0" y2="315.0" stroke="#000" stroke-width="2.2"/><line x1="142" y1="315" x2="472.2" y2="417.6" stroke="#000" stroke-width="2.2"/><line x1="142" y1="915" x2="305.0" y2="915.0" stroke="#000" stroke-width="2.2"/><line x1="1103" y1="540" x2="859.4" y2="501.8" stroke="#000" stroke-width="2.2"/><line x1="1103" y1="540" x2="859.4" y2="578.2" stroke="#000" stroke-width="2.2"/><line x1="110" y1="857" x2="110" y2="463" stroke="#000" stroke-width="2.2"/><polygon points="110,439 97,463 123,463" fill="#fff" stroke="#000" stroke-width="2.2"/><text x="30" y="1100" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="20" text-anchor="start" font-weight="normal" font-style="normal" fill="#222">Solid line: the user takes part in the use case. Hollow arrow: the Engineer has every right the Operator has.</text><text x="30" y="1130" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="20" text-anchor="start" font-weight="normal" font-style="normal" fill="#222">UC-2 and UC-4 start automatically. UC-2 alerts the Operator or Engineer. UC-4 involves no user action.</text></svg>