<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1010" viewBox="0 0 1400 1010"><title>Context diagram</title><rect width="1400" height="1010" fill="#fff"/><defs><marker id="ah" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="15" markerHeight="15" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#000"/></marker></defs><rect x="470" y="40" width="320" height="920" rx="14" fill="#fff" stroke="#000" stroke-width="3"/><text x="630" y="480" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" font-style="normal" fill="#000">Industrial Fault</text><text x="630" y="520" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" font-style="normal" fill="#000">Detection System</text><rect x="10" y="440" width="240" height="120" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="130" y="490" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="22" text-anchor="middle" font-weight="bold" font-style="normal" fill="#000">Equipment data</text><text x="130" y="520" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="22" text-anchor="middle" font-weight="bold" font-style="normal" fill="#000">source (simulated)</text><line x1="250" y1="500" x2="468" y2="500" stroke="#000" stroke-width="2.4" marker-end="url(#ah)"/><text x="360" y="440" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="20" text-anchor="middle" font-weight="normal" font-style="italic" fill="#000">Sensor readings,</text><text x="360" y="465" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="20" text-anchor="middle" font-weight="normal" font-style="italic" fill="#000">one per second</text><text x="360" y="490" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="20" text-anchor="middle" font-weight="normal" font-style="italic" fill="#000">per parameter</text><rect x="1130" y="155" width="2