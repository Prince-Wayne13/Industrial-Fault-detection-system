 font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="20" text-anchor="middle" font-weight="normal" font-style="italic" fill="#000">history, reports and</text><text x="960" y="466" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="20" text-anchor="middle" font-weight="normal" font-style="italic" fill="#000">fault pop-ups</text><line x1="1130" y1="522" x2="792" y2="522" stroke="#000" stroke-width="2.4" marker-end="url(#ah)"/><text x="960" y="550" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="20" text-anchor="middle" font-weight="normal" font-style="italic" fill="#000">Login, acknowledge or</text><text x="960" y="575" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="20" text-anchor="middle" font-weight="normal" font-style="italic" fill="#000">resolve a fault, maintenance</text><text x="960" y="600" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="20" text-anchor="middle" font-weight="normal" font-style="italic" fill="#000">mode, limit changes,</text><text x="960" y="625" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="20" text-anchor="middle" font-weight="normal" font-style="italic" fill="#000">report requests</text><rect x="1130" y="755" width="260" height="90" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1260" y="809" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="26" text-anchor="middle" font-weight="bold" font-style="normal" fill="#000">Administrator</text><line x1="790" y1="778" x2="1128" y2="778" stroke="#000" stroke-width="2.4" marker-end="url(#ah)"/><text x="960" y="716" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="20" text-anchor="middle" font-weight="normal" font-style="italic" fill="#000">Status, readings, fault</text><text x="960" y="741" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="20" text-anchor="middle" font-weight="normal" font-style="italic" fill="#000">history and the 75%</text><text x="960" y="766" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="20" text-anchor="middle" font-weight="normal" font-style="italic" fill="#000">storage alert</text><line x1="1130" y1="822" x2="792" y2="822" stroke="#000" stroke-width="2.4" marker-end="url(#ah)"/><text x="960" y="850" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="20" text-anchor="middle" font-weight="normal" font-style="italic" fill="#000">Login, user accounts,</text><text x="960" y="875" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="20" text-anchor="middle" font-weight="normal" font-style="italic" fill="#000">equipment registration</text><text x="960" y="900" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="20" text-anchor="middle" font-weight="normal" font-style="italic" fill="#000">and settings</text><text x="10" y="995" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="19" text-anchor="start" font-weight="normal" font-style="normal" fill="#222">Arrows show what passes between the system and the people and equipment around it.</text></svg>